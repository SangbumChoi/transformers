<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Molmo 2 — Explainer</title>
<style>
:root{--bg:#0b0e14;--ink:#e9edf3;--mut:#8b95a6;--acc:#ff5a5f;--teal:#37c6c0;--amber:#f0b849;--blue:#5aa0ff;--vio:#a889ff;--grn:#5ad18a;}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#05070c;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.stage{display:flex;flex-direction:column;align-items:center;gap:10px;padding:14px}
#cv{background:var(--bg);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.5);max-width:100%;height:auto}
.ctrl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
button{background:#161b26;color:var(--ink);border:1px solid #2a3242;border-radius:8px;padding:7px 13px;font-size:13px;cursor:pointer}
button:hover{border-color:var(--teal)}
.dots{display:flex;gap:6px}.dot{width:8px;height:8px;border-radius:50%;background:#2a3242;cursor:pointer}.dot.on{background:var(--teal)}
.hint{color:var(--mut);font-size:12px}
</style>
</head>
<body>
<div class="stage">
 <canvas id="cv" width="1280" height="720"></canvas>
 <div class="ctrl">
  <button id="pp">⏸ Pause</button><button id="prev">« Prev</button><button id="next">Next »</button>
  <button id="replay">⟲ Replay</button><div class="dots" id="dots"></div>
 </div>
 <div class="hint">Molmo 2 explainer · click a dot to jump · auto-plays</div>
</div>
<script>
"use strict";
const cv=document.getElementById("cv"), g=cv.getContext("2d"), CW=cv.width, CH=cv.height, W=960, H=540;
const C={bg:"#0b0e14",ink:"#e9edf3",mut:"#8b95a6",acc:"#ff5a5f",teal:"#37c6c0",amber:"#f0b849",blue:"#5aa0ff",vio:"#a889ff",grn:"#5ad18a",panel:"#121826",line:"#2a3242"};
const RECORD=new URLSearchParams(location.search).get("record")==="1";
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const clamp=(t,a=0,b=1)=>Math.max(a,Math.min(b,t));
const seg=(p,a,b)=>clamp((p-a)/(b-a));
function rr(x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function txt(s,x,y,size,col,al="center",bold=true){g.fillStyle=col;g.font=`${bold?700:400} ${size}px -apple-system,"Segoe UI",Roboto,sans-serif`;g.textAlign=al;g.fillText(s,x,y);}
function point(x,y,col,ring){if(ring>0){g.globalAlpha=(1-ring)*.9;g.strokeStyle=col;g.lineWidth=2;g.beginPath();g.arc(x,y,6+ring*22,0,7);g.stroke();g.globalAlpha=1;}
 g.fillStyle=col;g.beginPath();g.arc(x,y,5,0,7);g.fill();g.strokeStyle="#fff";g.lineWidth=1.5;g.beginPath();g.arc(x,y,5,0,7);g.stroke();}
function arrow(x1,y1,x2,y2,col){g.strokeStyle=col;g.lineWidth=2;g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke();
 const a=Math.atan2(y2-y1,x2-x1);g.fillStyle=col;g.beginPath();g.moveTo(x2,y2);g.lineTo(x2-9*Math.cos(a-.4),y2-9*Math.sin(a-.4));g.lineTo(x2-9*Math.cos(a+.4),y2-9*Math.sin(a+.4));g.closePath();g.fill();}
function box(x,y,w,h,label,sub,col,alpha=1){g.globalAlpha=alpha;g.fillStyle="#0d1320";rr(x,y,w,h,10);g.fill();g.strokeStyle=col;g.lineWidth=1.6;rr(x,y,w,h,10);g.stroke();
 txt(label,x+w/2,y+h/2-(sub?6:-5),14,C.ink);if(sub)txt(sub,x+w/2,y+h/2+13,10.5,C.mut,"center",false);g.globalAlpha=1;}
function tabletop(ox,oy,sc){g.save();g.translate(ox,oy);g.scale(sc,sc);
 g.fillStyle="#0d1320";rr(-10,-10,420,250,14);g.fill();
 g.fillStyle="rgba(0,0,0,.35)";g.beginPath();g.ellipse(210,200,180,26,0,0,7);g.fill();
 g.fillStyle="#1c2433";rr(10,150,390,70,8);g.fill();g.fillStyle="#3a4a63";rr(40,120,90,30,4);g.fill();g.fillStyle="#526687";rr(40,116,90,8,3);g.fill();
 g.fillStyle="#20304a";rr(300,110,44,80,8);g.fill();g.fillStyle="#33507a";rr(305,116,34,60,4);g.fill();
 const cups=[[156,124],[206,114],[252,128]];cups.forEach(([x,y])=>{const w=32,h=46;
  g.strokeStyle="#e7ecf5";g.lineWidth=5;g.beginPath();g.arc(x+w+3,y+h*0.52,9,-1.25,1.25);g.stroke();
  g.fillStyle="#e7ecf5";rr(x,y+3,w,h-3,5);g.fill();
  g.fillStyle="rgba(20,26,38,.16)";rr(x+w*0.63,y+5,w*0.35,h-8,4);g.fill();
  g.fillStyle="#cfd8e6";g.beginPath();g.ellipse(x+w/2,y+3,w/2,5,0,0,7);g.fill();
  g.fillStyle="#3a2a20";g.beginPath();g.ellipse(x+w/2,y+3,w/2-4,3.3,0,0,7);g.fill();});
 g.restore();return cups.map(([x,y])=>[ox+(x+16)*sc,oy+(y+24)*sc]);}
function drawBG(){const rg=g.createRadialGradient(W/2,H*0.40,50,W/2,H*0.5,W*0.72);rg.addColorStop(0,"#131a29");rg.addColorStop(1,"#080b11");g.fillStyle=rg;g.fillRect(0,0,W,H);
 g.fillStyle="rgba(255,255,255,.020)";for(let y=58;y<H-24;y+=27)for(let x=26;x<W;x+=27){g.beginPath();g.arc(x,y,1,0,7);g.fill();}}
function mic(x,y,s,col){g.save();g.translate(x,y);g.scale(s,s);g.fillStyle=col;rr(-9,-26,18,30,9);g.fill();g.strokeStyle=col;g.lineWidth=3;g.beginPath();g.arc(0,-11,15,.3,Math.PI-.3);g.stroke();g.beginPath();g.moveTo(0,4);g.lineTo(0,16);g.moveTo(-10,16);g.lineTo(10,16);g.stroke();g.restore();}
function wave(x,y,w,ph,amp){g.strokeStyle=C.teal;g.lineWidth=2;g.beginPath();for(let i=0;i<=40;i++){const t=i/40,xx=x+t*w,a=amp*Math.sin(t*20-ph)*Math.sin(t*Math.PI);g.lineTo(xx,y-a);}g.stroke();}
function cursor(x,y){g.fillStyle="#fff";g.beginPath();g.moveTo(x,y);g.lineTo(x,y+16);g.lineTo(x+4,y+12);g.lineTo(x+7,y+18);g.lineTo(x+9,y+17);g.lineTo(x+6,y+11);g.lineTo(x+11,y+11);g.closePath();g.fill();g.strokeStyle="#111";g.lineWidth=1;g.stroke();}
// ---- realistic street "video frame" ----
function car(x,y,s,col){g.save();g.translate(x,y);g.scale(s,s);
 g.fillStyle="rgba(0,0,0,.4)";g.beginPath();g.ellipse(0,12,40,7,0,0,7);g.fill();
 g.fillStyle=col;rr(-34,-12,68,20,7);g.fill();rr(-22,-26,46,18,7);g.fill();
 g.fillStyle="#0a0d12";g.beginPath();g.arc(-20,9,8,0,7);g.fill();g.beginPath();g.arc(20,9,8,0,7);g.fill();
 g.fillStyle="#39424f";g.beginPath();g.arc(-20,9,4,0,7);g.fill();g.beginPath();g.arc(20,9,4,0,7);g.fill();
 g.fillStyle="#a9d6ec";rr(-18,-23,18,12,3);g.fill();rr(4,-23,15,12,3);g.fill();
 g.fillStyle="#ffe08a";g.beginPath();g.arc(33,-1,3.4,0,7);g.fill();g.fillStyle="#ff6b6b";g.beginPath();g.arc(-33,-1,2.6,0,7);g.fill();
 g.restore();}
function street(ox,oy,w,h,t){g.save();rr(ox,oy,w,h,8);g.clip();
 const hz=oy+h*0.5;
 let sky=g.createLinearGradient(0,oy,0,hz);sky.addColorStop(0,"#1a2440");sky.addColorStop(1,"#3a3355");
 g.fillStyle=sky;g.fillRect(ox,oy,w,hz-oy);
 // buildings
 g.fillStyle="#0e131d";for(let i=0;i<7;i++){const bx=ox+i*(w/7),bh=30+((i*53)%40);g.fillRect(bx,hz-bh,w/7-6,bh);
  g.fillStyle="#f0d060";for(let wy=0;wy<3;wy++)for(let wx=0;wx<3;wx++){if(((i*7+wx*3+wy)%3)===0)g.fillRect(bx+6+wx*10,hz-bh+6+wy*10,5,6);}g.fillStyle="#0e131d";}
 // road
 let road=g.createLinearGradient(0,hz,0,oy+h);road.addColorStop(0,"#2b2f37");road.addColorStop(1,"#141619");
 g.fillStyle=road;g.beginPath();g.moveTo(ox+w*0.44,hz);g.lineTo(ox+w*0.56,hz);g.lineTo(ox+w,oy+h);g.lineTo(ox,oy+h);g.closePath();g.fill();
 // sidewalks
 g.fillStyle="#20242c";g.beginPath();g.moveTo(ox,oy+h);g.lineTo(ox+w*0.44,hz);g.lineTo(ox+w*0.40,hz);g.lineTo(ox-40,oy+h);g.closePath();g.fill();
 g.beginPath();g.moveTo(ox+w,oy+h);g.lineTo(ox+w*0.56,hz);g.lineTo(ox+w*0.60,hz);g.lineTo(ox+w+40,oy+h);g.closePath();g.fill();
 // lane dashes
 g.strokeStyle="#c9cf58";for(let k=0;k<6;k++){const f=k/6,f2=(k+.5)/6;const y1=hz+(oy+h-hz)*f*f,y2=hz+(oy+h-hz)*f2*f2;g.lineWidth=1+4*f;g.beginPath();g.moveTo(ox+w/2,y1);g.lineTo(ox+w/2,y2);g.stroke();}
 // crosswalk
 g.fillStyle="rgba(220,225,235,.55)";for(let k=0;k<6;k++){const yy=oy+h*0.82;g.fillRect(ox+w*0.30+k*w*0.07,yy,w*0.045,10);}
 // pedestrian
 g.fillStyle="#d9d2c0";g.beginPath();g.arc(ox+w*0.24,oy+h*0.7,6,0,7);g.fill();rr(ox+w*0.24-5,oy+h*0.7+5,10,20,4);g.fill();
 // car driving left->right along the near lane
 const cx=ox+w*(0.14+0.72*t), cy=oy+h*0.78, sc=0.7+0.5*t;
 car(cx,cy,sc,"#4f9dff");
 g.restore();g.strokeStyle=C.line;g.lineWidth=1.4;rr(ox,oy,w,h,8);g.stroke();
 return [cx,cy,sc];}

const CAP="A wooden table holds three white ceramic mugs, a closed hardcover book, and a dark smartphone lying face-up.".split(" ");

const scenes=[
{dur:6, en:"Molmo 2 — teaching AI to point, in video.", draw(p){txt("Ai2 · Allen Institute for AI",W/2,150,17,C.mut,"center",false);
 const s=ease(seg(p,.1,.5));txt("Molmo 2",W/2,240,74*(.6+.4*s),C.ink);g.globalAlpha=s;txt("Teaching AI to point — in video",W/2,290,22,C.teal);g.globalAlpha=1;point(W/2,360,C.acc,(p*1.2)%1);}},

{dur:7, en:"Describing an image is not the same as knowing WHERE things are.", draw(p){const c=tabletop(300,120,.62);
 g.globalAlpha=seg(p,.1,.35);txt("“a few cups on a table”",W/2,110,18,C.ink);g.globalAlpha=1;
 const q=seg(p,.45,.8);if(q>0){g.globalAlpha=q;txt("but… which pixels? where exactly?",W/2,400,18,C.amber);g.globalAlpha=1;txt("?",c[1][0],c[1][1]-26+Math.sin(p*8)*3,40,C.amber);}}},

{dur:8, en:"Molmo (2024): the first fully-open VLM that points at pixels.", draw(p){const c=tabletop(300,110,.62);let n=0;
 c.forEach((pt,i)=>{const st=.2+i*.18,r=seg(p,st,st+.5);if(r>0){point(pt[0],pt[1],C.acc,Math.min(1,r*1.8));if(r>.15)n++;}});
 if(n>0)txt("×"+n+" cups",W/2,110,22,C.teal);g.globalAlpha=seg(p,.8,1);txt("a point lets it count, refer, and ground language to pixels",W/2,405,15,C.mut,"center",false);g.globalAlpha=1;}},

{dur:8, en:"Its real edge: no proprietary VISION model ever labels the image.", draw(p){
 const a=ease(seg(p,.1,.45));g.globalAlpha=a;txt("Most “open” VLMs DISTILL a closed model",W/2,180,20,C.ink);txt("(train on GPT-4V looking at the image)",W/2,210,15,C.mut,"center",false);g.globalAlpha=1;
 const b=ease(seg(p,.5,.9));if(b>0){g.globalAlpha=b;txt("Molmo’s PixMo: the visual labels come from HUMANS —",W/2,300,20,C.teal);txt("no vision-language model in the loop.",W/2,330,18,C.ink);g.globalAlpha=1;}}},

{dur:9, en:"PixMo-Cap: humans DESCRIBE each image aloud; a text-only LLM tidies it.", draw(p){
 tabletop(60,150,.40);mic(290,250,1.6+.15*Math.sin(p*18),C.acc);wave(330,250,250,p*22,26+14*Math.abs(Math.sin(p*9)));
 const nw=Math.floor(seg(p,.25,.9)*CAP.length);g.textAlign="left";g.font='400 15px sans-serif';g.fillStyle=C.ink;
 let line="",yy=345,xx=110;for(let i=0;i<nw;i++){const wd=CAP[i]+" ";if(g.measureText(line+wd).width>760){g.fillText(line,xx,yy);line="";yy+=24;}line+=wd;}g.fillText(line,xx,yy);
 g.globalAlpha=seg(p,.78,1);txt("speech → transcript → a language-only LLM cleans it (never sees the image)",W/2,470,14,C.mut,"center",false);g.globalAlpha=1;txt("PixMo-Cap",110,150,18,C.teal,"left");}},

{dur:8, en:"PixMo-Points: humans click every instance — cheap, real grounding.", draw(p){const c=tabletop(300,110,.62);
 const order=[0,2,1];let shown=0;order.forEach((oi,k)=>{const st=.15+k*.2,r=seg(p,st,st+.45);if(r>0){const pt=c[oi];
  if(r<1){const cx=pt[0]-40+40*ease(r),cy=pt[1]-40+40*ease(r);cursor(cx,cy);}point(pt[0],pt[1],C.acc,Math.min(1,r*1.8));if(r>.3)shown++;}});
 if(shown)txt("count = "+shown,W/2,110,22,C.teal);g.globalAlpha=seg(p,.82,1);txt("points are fast to annotate → a huge REAL grounding dataset",W/2,405,15,C.mut,"center",false);g.globalAlpha=1;txt("PixMo-Points",640,150,18,C.acc,"left");}},

{dur:9, en:"The PixMo family — human-grounded, and augmented by text-only LLMs.", draw(p){
 const fam=[["PixMo-Cap","speech captions (human)",C.teal],["PixMo-Points","human 2D clicks",C.acc],["PixMo-Count","counting by pointing",C.amber],
  ["PixMo-CapQA","Q&A: LLM from captions",C.blue],["PixMo-AskAnything","annotator + text LLM",C.vio],["PixMo-Docs","synthetic charts/docs",C.grn]];
 fam.forEach((f,i)=>{const s=ease(seg(p,.08+i*.11,.5+i*.11));if(s<=0)return;const col=i%3,row=Math.floor(i/3);const x=150+col*230,y=140+row*135;g.globalAlpha=s;
  box(x,y,205,110,f[0],"",f[2]);txt(f[1],x+102,y+72,11.5,C.mut,"center",false);g.globalAlpha=1;});
 g.globalAlpha=seg(p,.85,1);txt("no VLM distillation — but text-only LLMs generate Q&A and synthetic docs",W/2,420,14,C.mut,"center",false);g.globalAlpha=1;}},

{dur:9, en:"An honest caveat: it is NOT trained from scratch.", draw(p){const y=170,h=64;
 box(90,y,200,h,"pretrained VISION","CLIP → SigLIP 2 (frozen-ish)",C.teal,ease(seg(p,.1,.4)));
 box(390,y,180,h,"NEW connector","the only fresh weights",C.amber,ease(seg(p,.35,.6)));
 box(670,y,200,h,"pretrained LLM","OLMo / Qwen (2·3)",C.vio,ease(seg(p,.55,.8)));
 g.globalAlpha=seg(p,.7,1);txt("the novelty is the DATA + recipe — the backbones are pretrained",W/2,300,17,C.ink);
 txt("“open” is a spectrum: the -O (OLMo) variant is fully-open lineage;",W/2,340,15,C.mut,"center",false);
 txt("the Qwen-based ones use open-WEIGHT (not open-DATA) backbones",W/2,364,15,C.mut,"center",false);g.globalAlpha=1;}},

{dur:9, en:"Training: caption pre-training, then fine-tuning on the PixMo mixture.", draw(p){
 const s1=ease(seg(p,.1,.5)),s2=ease(seg(p,.5,.9));
 if(s1>0){g.globalAlpha=s1;box(140,180,300,64,"Stage 1 · caption pre-training","learn to describe (PixMo-Cap)",C.teal);g.globalAlpha=1;}
 if(seg(p,.48,.52)>0)arrow(445,212,505,212,C.mut);
 if(s2>0){g.globalAlpha=s2;box(510,180,320,64,"Stage 2 · supervised fine-tuning","points, counts, docs, QA…",C.amber);g.globalAlpha=1;}
 g.globalAlpha=seg(p,.85,1);txt("no RLHF — just open data and two simple stages on pretrained parts",W/2,320,15,C.mut,"center",false);g.globalAlpha=1;}},

{dur:10, en:"Molmo 2 (2025): it POINTS at objects in video and tracks them in time.", draw(p){
 const fx=210,fy=95,fw=540,fh=250,t=clamp(seg(p,.12,.9),0,1);
 const c=street(fx,fy,fw,fh,t);
 for(let k=1;k<=6;k++){const tt=clamp(t-k*0.05,0,1);const px=fx+fw*(0.14+0.72*tt),py=fy+fh*0.78;g.globalAlpha=0.13*(7-k);g.fillStyle=C.acc;g.beginPath();g.arc(px,py,3,0,7);g.fill();g.globalAlpha=1;}
 g.globalAlpha=0.20;g.fillStyle=C.acc;g.beginPath();g.ellipse(c[0],c[1]-3*c[2],40*c[2],24*c[2],0,0,7);g.fill();g.globalAlpha=1;
 point(c[0],c[1]-12*c[2],C.acc,0);txt("point",c[0],c[1]-34*c[2],12,C.acc);
 txt("a POINT follows “the car” · the mask is derived with SAM 2 — Molmo never emits a box",W/2,375,14,C.mut,"center",false);
 const tl=t;g.strokeStyle=C.line;g.lineWidth=4;g.beginPath();g.moveTo(fx,405);g.lineTo(fx+fw,405);g.stroke();g.strokeStyle=C.acc;g.beginPath();g.moveTo(fx,405);g.lineTo(fx+fw*tl,405);g.stroke();
 txt("t = "+(tl*3.2).toFixed(1)+" s",fx+fw+8,409,12,C.mut,"left",false);}},

{dur:8, en:"Architecture: SigLIP 2 vision → connector → Qwen3 / OLMo.", draw(p){const y=165,h=68;
 box(60,y,148,h,"Video / images","frames",C.blue,ease(seg(p,.05,.3)));if(seg(p,.28,.32)>0)arrow(210,y+h/2,242,y+h/2,C.mut);
 box(244,y,138,h,"SigLIP 2","vision encoder",C.teal,ease(seg(p,.28,.5)));if(seg(p,.5,.54)>0)arrow(384,y+h/2,416,y+h/2,C.mut);
 box(418,y,128,h,"Connector","vision→LLM",C.mut,ease(seg(p,.5,.7)));if(seg(p,.7,.74)>0)arrow(548,y+h/2,580,y+h/2,C.mut);
 box(582,y,150,h,"Qwen3 / OLMo","8B · 4B · 7B",C.vio,ease(seg(p,.7,.9)));
 const s=ease(seg(p,.85,1));if(s>0){arrow(732,y+h/2,766,y+h/2,C.mut);g.globalAlpha=s;["text answers","points (x,y)","tracks over time"].forEach((o,i)=>txt("• "+o,774,y+18+i*24,14,[C.ink,C.acc,C.amber][i],"left"));g.globalAlpha=1;}}},

{dur:8, en:"An 8B that beats last year’s 72B — and Gemini 3 on tracking.", draw(p){const bars=[["InternVL3.5-8B",54.1,C.mut],["Qwen3-VL-8B",59.5,C.blue],["Molmo 2-8B",63.1,C.acc]];const base=380,maxH=210;
 bars.forEach((b,i)=>{const s=ease(seg(p,.15+i*.15,.6+i*.15)),hh=(b[1]/70)*maxH*s,x=200+i*160;g.fillStyle=b[2];rr(x,base-hh,110,hh,6);g.fill();txt(b[0],x+55,base+20,12,C.mut,"center",false);if(s>.6)txt(b[1].toFixed(1),x+55,base-hh-8,16,b[2]);});
 txt("avg. of 15 image + video benchmarks",W/2,120,13,C.mut,"center",false);g.globalAlpha=seg(p,.75,1);txt("8B > last year’s Molmo 72B · #1 open on video tracking",W/2,415,16,C.teal);g.globalAlpha=1;}},

{dur:9, en:"MolmoPoint: pointing as text is clumsy — coordinates cost tokens.", draw(p){
 const c=tabletop(90,180,.42);point(c[1][0],c[1][1],C.acc,Math.min(1,seg(p,.1,.4)*1.8));
 const a=ease(seg(p,.2,.5));g.globalAlpha=a;txt("old way: WRITE the point as text",560,180,17,C.ink,"left");
 g.font='700 22px monospace';g.fillStyle=C.amber;g.textAlign="left";g.fillText("“( x = 412 , y = 287 )”",560,220);g.globalAlpha=1;
 g.globalAlpha=seg(p,.55,.95);txt("→ the model must learn a coordinate system,",560,270,15,C.mut,"left",false);
 txt("   and spend many tokens per point.",560,292,15,C.mut,"left",false);g.globalAlpha=1;
 g.globalAlpha=seg(p,.8,1);txt("MolmoPoint (2026): point by SELECTING visual tokens instead.",W/2,410,16,C.teal);g.globalAlpha=1;}},

{dur:10, en:"Grounding tokens: PATCH → SUBPATCH → LOCATION, coarse to fine.", draw(p){const gx=120,gy=140,gs=210;g.strokeStyle=C.line;g.lineWidth=1;
 const s1=seg(p,.08,.3),s2=seg(p,.3,.5),s3=seg(p,.5,.7);
 for(let i=0;i<=4;i++){g.beginPath();g.moveTo(gx+i*gs/4,gy);g.lineTo(gx+i*gs/4,gy+gs);g.stroke();g.beginPath();g.moveTo(gx,gy+i*gs/4);g.lineTo(gx+gs,gy+i*gs/4);g.stroke();}
 if(s1>0){g.globalAlpha=s1;g.strokeStyle=C.teal;g.lineWidth=2.5;g.strokeRect(gx+2*gs/4,gy+gs/4,gs/4,gs/4);g.globalAlpha=1;}
 if(s2>0){g.globalAlpha=s2;g.strokeStyle=C.amber;g.lineWidth=2.5;g.strokeRect(gx+2*gs/4+gs/16,gy+gs/4+gs/16,gs/8,gs/8);g.globalAlpha=1;}
 if(s3>0)point(gx+2*gs/4+gs/8,gy+gs/4+gs/8,C.acc,Math.min(1,s3*1.6));
 [["<PATCH>","pick a coarse patch",C.teal,s1],["<SUBPATCH>","refine to a ViT sub-patch",C.amber,s2],["<LOCATION>","1 of 9 cells (3×3)",C.acc,s3]].forEach((t,i)=>{g.globalAlpha=t[3]>0?1:.3;txt(t[0],420,170+i*46,20,t[2],"left");txt(t[1],620,170+i*46,13,C.mut,"left",false);g.globalAlpha=1;});
 g.globalAlpha=seg(p,.72,1);txt("couples recognition ↔ localization · resolution-independent · works on video",W/2,395,14,C.mut,"center",false);
 txt("PointBench 70.7 · GUI pointing +5 pts · video tracking J&F 62.5 vs 56.7",W/2,420,15,C.teal);g.globalAlpha=1;}},

{dur:7, en:"Open — weights, data, code. Next (2026): any-modality + robotics.", draw(p){["Open weights","Open data","Open code","Open eval"].forEach((t,i)=>{const s=ease(seg(p,.1+i*.12,.5+i*.12));if(s<=0)return;const x=180+(i%2)*300,y=155+Math.floor(i/2)*66;g.globalAlpha=s;box(x,y,240,50,t,"",C.teal);g.globalAlpha=1;});
 g.globalAlpha=seg(p,.7,1);txt("2026: one model reasoning across every modality · robotics · streaming",W/2,400,15,C.amber);g.globalAlpha=1;}},

{dur:6, en:"Molmo 2 · Ai2 — point at what matters.", draw(p){const s=ease(seg(p,.05,.4));txt("Molmo 2",W/2,240,64,C.ink);g.globalAlpha=s;txt("point at what matters.",W/2,290,22,C.teal);g.globalAlpha=1;point(W/2,360,C.acc,(p*1.1)%1);txt("Ai2 · Allen Institute for AI",W/2,420,14,C.mut,"center",false);}}
];

const DUR=[10.2, 9.2, 13.0, 20.1, 16.4, 11.8, 22.9, 29.4, 17.5, 23.1, 11.3, 9.9, 14.9, 27.8, 12.6, 6.6]; if(Array.isArray(DUR)) scenes.forEach((s,i)=>{if(DUR[i])s.dur=DUR[i];});
const TOTAL=scenes.reduce((a,s)=>a+s.dur,0);window.__total=TOTAL;window.__finished=false;
let t0=performance.now(),paused=false,jump=null;
function curScene(el){let acc=0;for(let i=0;i<scenes.length;i++){if(el<acc+scenes[i].dur)return[i,(el-acc)/scenes[i].dur];acc+=scenes[i].dur;}return[scenes.length-1,1];}
function drawHeader(idx){g.fillStyle=C.panel;g.fillRect(0,0,W,40);g.fillStyle=C.acc;g.beginPath();g.arc(24,20,6,0,7);g.fill();txt("Ai2 · Molmo 2 — explainer",44,25,15,C.ink,"left");txt((idx+1)+" / "+scenes.length,W-16,25,13,C.mut,"right",false);}
function drawNarr(sc){txt(sc.en,W/2,500,22,C.ink);}
function drawProg(el){const y=522,x=40,w=W-80;g.strokeStyle=C.line;g.lineWidth=4;g.beginPath();g.moveTo(x,y);g.lineTo(x+w,y);g.stroke();g.strokeStyle=C.teal;g.beginPath();g.moveTo(x,y);g.lineTo(x+w*(el/TOTAL),y);g.stroke();}
function frame(now){let el;if(jump!==null){t0=now-jump*1000;jump=null;}el=paused?(window.__pausedEl||0):(now-t0)/1000;if(!paused)window.__pausedEl=el;
 if(el>=TOTAL){if(RECORD){window.__finished=true;el=TOTAL-0.01;}else{t0=now;el=0;}}
 const [idx,p]=curScene(clamp(el,0,TOTAL-.001));g.setTransform(CW/W,0,0,CH/H,0,0);drawBG();drawHeader(idx);g.save();scenes[idx].draw(clamp(p));g.restore();drawNarr(scenes[idx]);drawProg(el);
 const fd=p<0.05?1-p/0.05:(p>0.97?(p-0.97)/0.03:0);if(fd>0){g.globalAlpha=fd*0.92;g.fillStyle="#05070c";g.fillRect(0,0,W,H);g.globalAlpha=1;}
 g.setTransform(1,0,0,1,0,0);
 [...dotsEl.children].forEach((d,i)=>d.className="dot"+(i===idx?" on":""));requestAnimationFrame(frame);}
const dotsEl=document.getElementById("dots");
scenes.forEach((s,i)=>{const d=document.createElement("div");d.className="dot";d.onclick=()=>{let acc=0;for(let k=0;k<i;k++)acc+=scenes[k].dur;jump=acc;paused=false;pp.textContent="⏸ Pause";};dotsEl.appendChild(d);});
const pp=document.getElementById("pp");pp.onclick=()=>{paused=!paused;if(!paused)t0=performance.now()-window.__pausedEl*1000;pp.textContent=paused?"▶ Play":"⏸ Pause";};
document.getElementById("replay").onclick=()=>{jump=0;paused=false;pp.textContent="⏸ Pause";};
document.getElementById("prev").onclick=()=>{const[i]=curScene(window.__pausedEl||0);let acc=0;for(let k=0;k<Math.max(0,i-1);k++)acc+=scenes[k].dur;jump=acc;};
document.getElementById("next").onclick=()=>{const[i]=curScene(window.__pausedEl||0);let acc=0;for(let k=0;k<Math.min(scenes.length-1,i+1);k++)acc+=scenes[k].dur;jump=acc;};
if(RECORD){document.querySelector(".ctrl").style.display="none";document.querySelector(".hint").style.display="none";document.querySelector(".stage").style.padding="0";cv.style.borderRadius="0";cv.style.boxShadow="none";document.body.style.background="#0b0e14";}
requestAnimationFrame(frame);
</script>
